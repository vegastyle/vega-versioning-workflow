# This is a basic workflow to help automatically update the version of the branch and associated packaging files
name: Update Versioning
# Controls when the workflow will run
on:
  push:
  workflow_call:
    inputs:
      pyproject_path:
        description: "Path to the pyproject.toml file"
        type: string
        default: "pyproject.toml"
      react_package_path:
        description: "Path to the package.json file"
        type: string
        default: "package.json"
      dockerfile_path:
        description: "Path to the Dockerfile"
        type: string
        default: "Dockerfile"
      cargo_path:
        description: "Path to the Cargo.toml file"
        type: string
        default: "Cargo.toml"
    outputs:
      semantic-version:
        description: "The calculated semantic version"
        value: ${{ jobs.update-semantic-version.outputs.semantic-version }}
      publish:
        description: "Whether to publish artifacts"
        value: ${{ jobs.update-semantic-version.outputs.publish }}
      release:
        description: "Whether to create a release"
        value: ${{ jobs.update-semantic-version.outputs.release }}
      build:
        description: "Colon-delimited build types (e.g., python:npm:rust:)"
        value: ${{ jobs.update-semantic-version.outputs.build }}

# Permissions that the job has
permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This first job gets the content from the last push request
  check-commit-message:
    name: check_commit_message
    runs-on: ubuntu-latest
    outputs:
      head-commit-subject: ${{ steps.get_head_commit_subject.outputs.subject }}
      head-commit-description: ${{ steps.get_head_commit_description.outputs.description }}
    steps:
      - name: Get repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Print head git commit message title
        id: get_head_commit_subject
        run: |
          echo "subject<<EOF" >> $GITHUB_OUTPUT
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # New branch - just get the current commit
            git log -1 --pretty=%s >> $GITHUB_OUTPUT
          else
            # Get all commit subjects in this push
            git log --pretty=%s ${{ github.event.before }}..${{ github.event.after }} >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Print head git commit message body
        id: get_head_commit_description
        run: |
          echo "description<<EOF" >> $GITHUB_OUTPUT
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # New branch - just get the current commit
            git log -1 --pretty=%b >> $GITHUB_OUTPUT
          else
            # Get all commit bodies in this push
            git log --pretty=%b ${{ github.event.before }}..${{ github.event.after }} >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT


  update-semantic-version:
    # This job will update the semantic version of the branch
    name: update_semantic_version
    runs-on: ubuntu-latest
    needs: check-commit-message
    if: ${{ !contains(needs.check-commit-message.outputs.head-commit-subject, '[#ignore]') && !contains(needs.check-commit-message.outputs.head-commit-description, '[#ignore]')}}
    outputs:
      semantic-version: ${{ steps.capture_env.outputs.semantic_version }}
      publish: ${{ steps.capture_env.outputs.publish }}
      release: ${{ steps.capture_env.outputs.release }}
      build: ${{ steps.capture_env.outputs.build }}
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      # Sets up python on the GitHub Server
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Used to install the requirements
      - name: Install dependencies
        run: pip install git+https://github.com/vegastyle/vega-packaging.git@v0.6.2

      - name: Run script
        run: >
          update_semantic_version
          --subject "${{needs.check-commit-message.outputs.head-commit-subject}}"
          --description "${{needs.check-commit-message.outputs.head-commit-description}}"
          --changelog_path CHANGELOG.md
          --pyproject_path ${{ inputs.pyproject_path || 'pyproject.toml' }}
          --react_package_path ${{ inputs.react_package_path || 'package.json' }}
          --dockerfile_path ${{ inputs.dockerfile_path || 'Dockerfile' }}
          --cargo_path ${{ inputs.cargo_path || 'Cargo.toml' }}
          --github_env
          --verbose

      - name: Capture env outputs for downstream jobs
        id: capture_env
        run: |
          echo "semantic_version=${{ env.SEMANTIC_VERSION }}" >> $GITHUB_OUTPUT
          echo "publish=${{ env.PUBLISH }}" >> $GITHUB_OUTPUT
          echo "release=${{ env.RELEASE }}" >> $GITHUB_OUTPUT
          echo "build=${{ env.BUILD }}" >> $GITHUB_OUTPUT

      - uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          commit_message: 'Updating Packaging Files and Label to v${{ env.SEMANTIC_VERSION }}'
          tagging_message: 'v${{ env.SEMANTIC_VERSION }}'
