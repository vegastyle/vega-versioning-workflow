name: Build and Publish React

on:
  workflow_call:
    inputs:
      semantic_version:
        description: "Semantic version to checkout and build"
        type: string
        required: true
      npm_registry:
        description: "NPM registry URL to publish to"
        type: string
        required: false
      vega_packaging_ref:
        description: "vega-packaging git ref to install"
        type: string
        default: "v0.7.1"
      build:
        description: "Colon-delimited build types (e.g., python:npm:rust:)"
        type: string
        required: true
      react_package_path:
        description: "Path to the package.json file"
        type: string
        default: "package.json"
      tailscale_tags:
        description: "Tailscale tags for the ephemeral CI node"
        type: string
        default: ""
      tailscale_ping:
        description: "Tailscale hostname/IP to ping before pushing (optional)"
        type: string
        required: false
    secrets:
      TS_OAUTH_CLIENT_ID:
        description: "Tailscale OAuth client ID. Required when tailscale_tags is set."
        required: false
      TS_OAUTH_SECRET:
        description: "Tailscale OAuth client secret. Required when tailscale_tags is set."
        required: false

jobs:
  build-and-publish-react:
    name: build_and_publish_react
    runs-on: ubuntu-latest
    steps:
      - name: Early exit if not an NPM project
        if: ${{ !contains(inputs.build, 'npm:') }}
        run: exit 0

      - uses: actions/checkout@v6
        with:
          ref: "v${{ inputs.semantic_version }}"

      - name: Connect to Tailscale
        if: inputs.tailscale_tags != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ inputs.tailscale_tags }}
          ping: ${{ inputs.tailscale_ping }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install vega-packaging
        run: pip install git+https://github.com/vegastyle/vega-packaging.git@${{ inputs.vega_packaging_ref }}

      - name: Build and publish NPM package
        run: >
          build_and_publish
          --publish
          --no-release
          --react_package_path ${{ inputs.react_package_path }}
          ${{ inputs.npm_registry && format('--npm_registry {0}', inputs.npm_registry) || '' }}
          --verbose
