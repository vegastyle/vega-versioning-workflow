name: Build and Publish Docker

on:
  workflow_call:
    inputs:
      semantic_version:
        description: "Semantic version to checkout and build"
        type: string
        required: true
      docker_registry:
        description: "Docker registry to publish images to"
        type: string
        required: false
      vega_packaging_ref:
        description: "vega-packaging git ref to install"
        type: string
        default: "v0.7.1"
      build_docker:
        description: "Whether to build Docker images (True/False)"
        type: string
        required: true

jobs:
  build-and-publish-docker:
    name: build_and_publish_docker
    runs-on: ubuntu-latest
    steps:
      - name: Early exit if not a Docker project
        if: inputs.build_docker != 'True'
        run: exit 0

      - uses: actions/checkout@v4
        with:
          ref: "v${{ inputs.semantic_version }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vega-packaging
        run: pip install git+https://github.com/vegastyle/vega-packaging.git@${{ inputs.vega_packaging_ref }}

      - name: Docker login
        if: inputs.docker_registry != ''
        run: docker login ${{ inputs.docker_registry }}

      - name: Build and publish Docker image
        run: >
          build_and_publish
          --publish
          --no-release
          ${{ inputs.docker_registry && format('--docker_registry {0}', inputs.docker_registry) || '' }}
          --verbose
